name: 4D architecture search

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'architecture/**'
      - 'scripts/architecture_*.py'
      - 'scripts/test_architecture_search.py'
      - 'docs/4d-past-signalling-protocol.txt'
      - 'docs/architecture-search.md'
      - 'notes/architecture-search-batch-v1.md'
      - '.github/workflows/architecture-search.yml'
  workflow_dispatch:

# No push, PR-writing or merge capability. In particular, an A cannot be auto-merged.
permissions:
  contents: read

concurrency:
  group: architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    name: Generate candidate records and numerical sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.tasks.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - name: Run fail-closed protocol tests
        run: python scripts/test_architecture_search.py
      - name: Generate from the pinned batch and validate all required fields
        run: |
          python scripts/architecture_search.py run --output "$RUNNER_TEMP/architecture/raw"
          python scripts/architecture_search.py validate --records "$RUNNER_TEMP/architecture/raw/candidates.json"
      - name: One separate verification task per candidate, including every B or A
        id: tasks
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'architecture/raw/candidates.json'
          records=json.loads(p.read_text())
          matrix={'include':[{'candidate':r['candidate_id']} for r in records['candidates']]}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
              print('matrix='+json.dumps(matrix,separators=(',',':')),file=stream)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: architecture-raw
          path: ${{ runner.temp }}/architecture/raw/
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Adversarial arithmetic / ${{ matrix.candidate }}
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: architecture-raw
          path: ${{ runner.temp }}/architecture/raw
      - name: Verify without importing the forward model generator
        env:
          CANDIDATE_ID: ${{ matrix.candidate }}
        run: >-
          python scripts/architecture_verify.py
          --records "$RUNNER_TEMP/architecture/raw/candidates.json"
          --candidate-id "$CANDIDATE_ID"
          --output "$RUNNER_TEMP/verification/$CANDIDATE_ID.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: architecture-verification-${{ matrix.candidate }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Architecture report and human-review gate
    if: always()
    needs: [generate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Never convert missing or failed research tasks to success
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$GENERATE_RESULT" = success
          test "$VERIFY_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: architecture-raw
          path: ${{ runner.temp }}/architecture/raw
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: architecture-verification-*
          merge-multiple: true
          path: ${{ runner.temp }}/architecture/tasks
      - name: Check exact artifact hashes and coverage
        run: >-
          python scripts/architecture_search.py collect
          --records "$RUNNER_TEMP/architecture/raw/candidates.json"
          --directory "$RUNNER_TEMP/architecture/tasks"
          --output "$RUNNER_TEMP/architecture/verification.json"
      - name: Generate the report, then block automatic clearance of any A
        run: >-
          python scripts/architecture_search.py finalize
          --records "$RUNNER_TEMP/architecture/raw/candidates.json"
          --verification "$RUNNER_TEMP/architecture/verification.json"
          --output "$RUNNER_TEMP/architecture/verified"
          --gate
      - name: Summarize without interpreting a passed CI as a physical success
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'architecture/verified/candidates.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              print('## 4D architecture search',file=out)
              if p.exists():
                  b=json.loads(p.read_text())
                  print('Primary statuses: '+json.dumps(b['counts']),file=out)
                  print('Checkout: '+str(b['provenance']['checkout_sha']),file=out)
                  print('Full records, verification tasks and report are attached as artifacts.',file=out)
              else:
                  print('No cleared report: a prerequisite failed or output is missing.',file=out)
              print('Computational checks are not independent peer review or an operational past-signalling proof.',file=out)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: architecture-report
          path: ${{ runner.temp }}/architecture/
          if-no-files-found: warn
          retention-days: 30
