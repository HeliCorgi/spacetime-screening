name: Phase 1 pinned audit

on:
  push:
    branches: ['audit/chronology-phase1-20261008']
    paths: ['.github/workflows/phase1-audit.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ff10c4453f52f9f8f8c2c835a52812ce7faac90
          persist-credentials: false
      - name: Archive the exact audited revision
        run: |
          mkdir -p "$RUNNER_TEMP/phase1-source"
          git rev-parse HEAD > "$RUNNER_TEMP/phase1-source/COMMIT.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/phase1-source/MANIFEST.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/phase1-source/source.tar"
          sha256sum "$RUNNER_TEMP/phase1-source/source.tar" > "$RUNNER_TEMP/phase1-source/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-source-1ff10c4
          path: ${{ runner.temp }}/phase1-source/
          retention-days: 7

  python:
    name: Pinned Python ${{ matrix.python }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ff10c4453f52f9f8f8c2c835a52812ce7faac90
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src/symbolic src/numerical
      - run: python scripts/ci/checks.py plan --full --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Execute unchanged existing assertions
        run: >-
          python scripts/ci/checks.py run --plan "$RUNNER_TEMP/ci-plan.json"
          --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-plan-${{ matrix.python }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-plan.json
          retention-days: 7

  selector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ff10c4453f52f9f8f8c2c835a52812ce7faac90
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          unset GITHUB_STEP_SUMMARY
          python scripts/ci/test_checks.py 2>&1 | sed 's/^::/[expected test control] ::/'

  lean:
    uses: ./.github/workflows/chronology-six-gate.yml
