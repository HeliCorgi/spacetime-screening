name: SA quantum record v4
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/symbolic/sa_quantum_junction_v4.py'
      - 'src/numerical/sa_inner_scattering_v4.py'
      - 'scripts/sa_quantum_*_v4.py'
      - 'scripts/architecture_search.py'
      - 'architecture/sa-quantum-record-v4.json'
      - 'architecture/requirements.lock'
      - 'docs/4d-past-signalling-protocol.txt'
      - 'notes/sa-quantum-record-v4.md'
      - '.github/workflows/sa-quantum-record-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sa-quantum-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  calculate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - name: Preserve original protocol and calculate the specified 4D components
        run: |
          python scripts/test_architecture_search.py
          python -m compileall -q src/symbolic/sa_quantum_junction_v4.py src/numerical/sa_inner_scattering_v4.py scripts/sa_quantum_verify_v4.py scripts/sa_quantum_report_v4.py
          mkdir -p "$RUNNER_TEMP/sa-v4"
          python src/symbolic/sa_quantum_junction_v4.py > "$RUNNER_TEMP/sa-v4/junction.json"
          python src/numerical/sa_inner_scattering_v4.py --output "$RUNNER_TEMP/sa-v4/scattering.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sa-v4-calculations
          path: ${{ runner.temp }}/sa-v4/
          if-no-files-found: error
          retention-days: 30
  verify-and-report:
    needs: calculate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sa-v4-calculations
          path: ${{ runner.temp }}/sa-v4
      - name: Alternate arithmetic, scope controls and evidence-bound report
        run: |
          python scripts/sa_quantum_verify_v4.py --tests
          python scripts/sa_quantum_verify_v4.py --junction "$RUNNER_TEMP/sa-v4/junction.json" --scattering "$RUNNER_TEMP/sa-v4/scattering.json" --output "$RUNNER_TEMP/sa-v4/verification.json"
          python scripts/sa_quantum_report_v4.py --evidence "$RUNNER_TEMP/sa-v4" --tests
          python scripts/sa_quantum_report_v4.py --evidence "$RUNNER_TEMP/sa-v4" --output "$RUNNER_TEMP/sa-v4/verified" --gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sa-v4-report
          path: ${{ runner.temp }}/sa-v4/
          if-no-files-found: error
          retention-days: 30
