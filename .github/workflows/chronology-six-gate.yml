# Python checks are owned by pr-checks.yml / symbolic-ci.yml: no duplicate job.
name: Lean checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-causal-lemma:
    name: Conditional causal-order lemma (Lean 4.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          mkdir -p "$RUNNER_TEMP/lean"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/lean.tar.zst" \
            --strip-components=1 -C "$RUNNER_TEMP/lean"
      - name: Kernel-check standalone Lean files; retain axiom output
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lean/bin/lean" --version
          mapfile -d '' -t files < <(git ls-files -z 'src/lean/*.lean')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No Lean files remain; no theorem is claimed checked.'
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            "$RUNNER_TEMP/lean/bin/lean" "$file"
          done | tee "$RUNNER_TEMP/lean-check.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chronology-conditional-causal-lemma
          path: ${{ runner.temp }}/lean-check.txt
          if-no-files-found: ignore
          retention-days: 7
