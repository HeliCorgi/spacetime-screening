name: Charged source and handle
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'architecture/charged-source-handle-v3.json'
      - 'architecture/requirements.lock'
      - 'scripts/architecture_charged_*.py'
      - 'scripts/test_architecture_charged_search.py'
      - 'scripts/architecture_search.py'
      - 'docs/4d-past-signalling-protocol.txt'
      - 'notes/charged-source-handle-v3.md'
      - '.github/workflows/architecture-charged-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charged-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - name: Preserve original protocol and run source/handle negative controls
        run: |
          python scripts/test_architecture_search.py
          python scripts/test_architecture_charged_search.py
      - name: Generate 4D diagnostics; no invented receiver law
        run: python scripts/architecture_charged_search.py run --output "$RUNNER_TEMP/charged/raw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charged-raw
          path: ${{ runner.temp }}/charged/raw/
          retention-days: 30
          if-no-files-found: warn
  verify:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r architecture/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: charged-raw
          path: ${{ runner.temp }}/charged/raw
      - name: Separate 4D tensors, derivatives and integrals without model import
        run: >-
          python scripts/architecture_charged_verify.py
          --records "$RUNNER_TEMP/charged/raw/candidates.json"
          --output "$RUNNER_TEMP/charged/verification.json"
      - name: Check hashes and coverage; block automatic clearance of any A
        run: >-
          python scripts/architecture_charged_search.py finalize
          --records "$RUNNER_TEMP/charged/raw/candidates.json"
          --verification "$RUNNER_TEMP/charged/verification.json"
          --output "$RUNNER_TEMP/charged/verified" --gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: charged-source-handle-report
          path: ${{ runner.temp }}/charged/
          retention-days: 30
          if-no-files-found: warn
