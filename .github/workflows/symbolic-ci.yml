# Full reproducibility only. Normal PRs use pr-checks.yml.
# Name retained so symbolic-ci-monitor.yml continues reporting full runs.
name: Symbolic CI

on:
  schedule:
    - cron: '23 19 * * 0' # Weekly, Monday 04:23 JST (Sunday 19:23 UTC).
  workflow_dispatch:

permissions:
  contents: read

# Do not auto-cancel full runs. PRs have their own independent cancellation group.
concurrency:
  group: full-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Full Python ${{ matrix.python }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile all research sources on this Python version
        run: python -m compileall -q src/symbolic src/numerical
      - name: Generate complete target list
        run: python scripts/ci/checks.py plan --full --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Run the complete suite in disjoint, isolated shards
        run: >-
          python scripts/ci/checks.py run --plan "$RUNNER_TEMP/ci-plan.json"
          --shard ${{ matrix.shard }} --shards 4

  selector-tests:
    name: CI selector tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selector and expected failure controls
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_STEP_SUMMARY
          python scripts/ci/test_checks.py 2>&1 | sed 's/^::/[expected test control] ::/'

  lean:
    uses: ./.github/workflows/chronology-six-gate.yml
