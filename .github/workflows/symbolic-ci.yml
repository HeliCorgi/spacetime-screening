name: Symbolic CI

on:
  push:
    branches: [main]
    paths:
      - "src/symbolic/**"
      - "requirements.txt"
      - ".github/workflows/symbolic-ci.yml"
  pull_request:
    paths:
      - "src/symbolic/**"
      - "requirements.txt"
      - ".github/workflows/symbolic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic:
    name: symbolic (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile symbolic scripts
        run: |
          python -m compileall -q src/symbolic

      - name: Run symbolic assertions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/symbolic -maxdepth 1 -type f -name '*.py' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No symbolic scripts found."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "::group::${file}"
            python "${file}"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Symbolic CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scripts: $(find src/symbolic -maxdepth 1 -type f -name '*.py' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
