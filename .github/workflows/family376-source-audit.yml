name: Family 376 pinned source collection
on:
  push:
    branches: ['audit/family376-gr-bridge-20261008']
    paths: ['.github/workflows/family376-source-audit.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch only pinned primary sources; do not execute external code
        shell: bash
        run: |
          set -euo pipefail
          SHA=adc7f1241b42e322a6451854ab7e4b4c146bf78a
          mkdir math
          cd math
          git init -q
          git remote add origin https://github.com/openai/math.git
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          git sparse-checkout set \
            preprints/Finite-Instructions-and-Solenoidal-Shear-Flows-September-27-2026 \
            preprints/A-Fixed-Particle-Test-for-Computation-in-a-Forced-Viscous-Flow-September-27-2026 \
            preprints/Universal-Computation-with-Eventually-Stationary-Navier-Stokes-Forcing-September-27-2026 \
            preprints/Geometric-Programs-for-Solenoidal-Forcing-September-27-2026 \
            preprints/Prefix-Instructions-and-Incompressible-Flows-September-27-2026 \
            preprints/Computation-under-Rapidly-Vanishing-Navier-Stokes-Forcing-September-27-2026 \
            preprints/Velocity-Field-Detection-of-Computation-in-Forced-Navier-Stokes-Flows-September-27-2026 \
            preprints/Scalar-Potentials-and-Slow-Clocks-for-Forced-Fluid-Computation-September-27-2026 \
            preprints/Incompressible-Box-Transport-and-Finite-Computation-September-27-2026 \
            lean/OAI/MathematicalPhysics/NavierStokes/ForcedComputation \
            lean/ComparatorChallenges lean/docs
          git fetch -q --depth=1 --filter=blob:none origin "$SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SHA"
          mkdir -p "$RUNNER_TEMP/family376"
          git rev-parse HEAD > "$RUNNER_TEMP/family376/COMMIT.txt"
          git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/family376/FULL_PATHS.txt"
          find preprints lean -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/family376/SHA256SUMS.txt"
          tar -cf "$RUNNER_TEMP/family376/source.tar" preprints lean README.md CONTENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: family376-pinned-primary-sources
          path: ${{ runner.temp }}/family376/
          if-no-files-found: error
          retention-days: 7
