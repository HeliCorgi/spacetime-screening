name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks and validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_required: ${{ steps.plan.outputs.python_required }}
      lean: ${{ steps.plan.outputs.lean }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the selector and failure controls
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_STEP_SUMMARY
          python scripts/ci/test_checks.py 2>&1 | sed 's/^::/[expected test control] ::/'
      - name: Plan from the entire PR diff, not just the last commit
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/ci/checks.py plan --base "$BASE_SHA" --head "$HEAD_SHA"
          --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Validate local Markdown file links
        run: python scripts/ci/checks.py docs --plan "$RUNNER_TEMP/ci-plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-ci-plan
          path: ${{ runner.temp }}/ci-plan.json
          retention-days: 7

  python:
    name: PR Python ${{ matrix.python }} / shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: pr-ci-plan
          path: ${{ runner.temp }}/ci-plan
      - run: python -m pip install -r requirements.txt
      - name: Compile all research sources (including unimported helpers)
        run: python -m compileall -q src/symbolic src/numerical
      - name: Execute selected assertions without reduced precision
        run: >-
          python scripts/ci/checks.py run --plan "$RUNNER_TEMP/ci-plan/ci-plan.json"
          --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}

  lean:
    needs: plan
    if: needs.plan.outputs.lean == 'true'
    uses: ./.github/workflows/chronology-six-gate.yml

  gate:
    name: PR checks
    if: always()
    needs: [plan, python, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report an explicit result even when research jobs are unnecessary
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PY_REQUIRED: ${{ needs.plan.outputs.python_required }}
          PY_RESULT: ${{ needs.python.result }}
          LEAN_REQUIRED: ${{ needs.plan.outputs.lean }}
          LEAN_RESULT: ${{ needs.lean.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          case "$PY_REQUIRED:$LEAN_REQUIRED" in
            true:true|true:false|false:true|false:false) ;;
            *) echo "Invalid selector outputs"; exit 1 ;;
          esac
          if [ "$PY_REQUIRED" = true ]; then test "$PY_RESULT" = success; fi
          if [ "$LEAN_REQUIRED" = true ]; then test "$LEAN_RESULT" = success; fi
          {
            echo '### PR checks'
            echo "- Python required: $PY_REQUIRED; result: $PY_RESULT"
            echo "- Lean required: $LEAN_REQUIRED; result: $LEAN_RESULT"
            echo '- PASS certifies selected software checks, not physical research claims.'
          } >> "$GITHUB_STEP_SUMMARY"
